<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAN - Rede Social</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f2f4f7; color: #111; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; }
    
    /* TELAS DE AUTENTICAÇÃO (LOGIN E CADASTRO) */
    .tela-auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1d2671, #c33764); padding: 20px; }
    .caixa-auth { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .logo-auth { text-align: center; font-size: 32px; font-weight: 900; color: #2864dc; margin-bottom: 5px; }
    .subtitulo-auth { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
    
    .campo { margin-bottom: 15px; }
    .campo label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 5px; text-transform: uppercase; }
    .entrada { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #ddd; outline: none; transition: 0.2s; }
    .entrada:focus { border-color: #2864dc; }
    
    .botao-primario { width: 100%; padding: 12px; background: #2864dc; color: #fff; font-size: 16px; margin-top: 10px; }
    .botao-primario:hover { background: #1f4eb2; }
    .botao-secundario { width: 100%; padding: 12px; background: #e4e6eb; color: #111; font-size: 16px; margin-top: 10px; }
    .botao-secundario:hover { background: #d8dadf; }
    
    .mensagem-erro { color: #d93025; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    
    /* APLICAÇÃO PRINCIPAL */
    #aplicativo { display: none; min-height: 100vh; background: #f2f4f7; }
    .barra-superior { height: 60px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 100; }
    .logotipo { font-size: 24px; font-weight: 800; color: #2864dc; }
    .acoes-topo { display: flex; gap: 10px; }
    .botao-sair { padding: 8px 16px; background: #ffebe9; color: #d93025; }
    
    .feed { width: 100%; max-width: 600px; margin: 20px auto; padding: 0 15px; }
    .caixa-post { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .caixa-post textarea { width: 100%; border: 1px solid #eee; border-radius: 8px; padding: 10px; resize: none; height: 80px; outline: none; }
    .caixa-post button { float: right; margin-top: 10px; padding: 8px 20px; background: #2864dc; color: #fff; }
    
    .post { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .autor-post { font-weight: 700; color: #333; margin-bottom: 5px; }
    .conteudo-post { font-size: 15px; color: #222; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin" class="tela-auth">
    <div class="caixa-auth">
      <div class="logo-auth">SAN</div>
      <div class="subtitulo-auth">Entre para se conectar</div>
      
      <div class="campo">
        <label>E-mail ou Utilizador</label>
        <input type="text" id="loginUsuario" class="entrada" placeholder="Digite seu e-mail ou utilizador">
      </div>
      <div class="campo">
        <label>Palavra-passe</label>
        <input type="password" id="loginSenha" class="entrada" placeholder="Digite sua palavra-passe">
      </div>
      
      <div id="erroLogin" class="mensagem-erro">Utilizador ou palavra-passe incorretos!</div>
      
      <button class="botao-primario" onclick="fazerLogin()">Entrar</button>
      <button class="botao-secundario" onclick="mostrarTela('telaCadastro')">Criar nova conta</button>
    </div>
  </div>

  <!-- TELA DE CADASTRO -->
  <div id="telaCadastro" class="tela-auth" style="display: none;">
    <div class="caixa-auth">
      <div class="logo-auth">SAN</div>
      <div class="subtitulo-auth">Crie a sua nova conta</div>
      
      <div class="campo">
        <label>Nome Completo</label>
        <input type="text" id="cadNome" class="entrada" placeholder="Seu nome completo">
      </div>
      <div class="campo">
        <label>Nome de Utilizador (@)</label>
        <input type="text" id="cadUsuario" class="entrada" placeholder="ex: lucas_san">
      </div>
      <div class="campo">
        <label>E-mail</label>
        <input type="email" id="cadEmail" class="entrada" placeholder="seu@email.com">
      </div>
      <div class="campo">
        <label>Palavra-passe</label>
        <input type="password" id="cadSenha" class="entrada" placeholder="Crie uma palavra-passe">
      </div>
      
      <div id="erroCadastro" class="mensagem-erro">Por favor, preencha todos os campos!</div>
      
      <button class="botao-primario" onclick="cadastrarUsuario()">Cadastrar</button>
      <button class="botao-secundario" onclick="mostrarTela('telaLogin')">Já tenho uma conta</button>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL (FEED) -->
  <div id="aplicativo">
    <div class="barra-superior">
      <div class="logotipo">SAN</div>
      <div class="acoes-topo">
        <button class="botao-sair" onclick="sair()">Sair</button>
      </div>
    </div>
    
    <div class="feed">
      <div class="caixa-post">
        <textarea id="textoPost" placeholder="O que está a acontecer?"></textarea>
        <button onclick="publicar()">Publicar</button>
        <div style="clear: both;"></div>
      </div>
      
      <div id="listaPosts">
        <!-- Posts aparecerão aqui -->
      </div>
    </div>
  </div>

  <script>
    // Inicialização do Banco de Dados Local (LocalStorage)
    if (!localStorage.getItem('san_usuarios')) {
      const usuariosIniciais = [
        { nome: 'Utilizador Teste', usuario: 'admin', email: 'admin@san.com', senha: '123' }
      ];
      localStorage.setItem('san_usuarios', JSON.stringify(usuariosIniciais));
    }
    
    if (!localStorage.getItem('san_posts')) {
      const postsIniciais = [
        { autor: 'SAN Oficial', conteudo: 'Bem-vindo à rede social SAN! Crie uma conta ou faça posts para testar.' }
      ];
      localStorage.setItem('san_posts', JSON.stringify(postsIniciais));
    }

    let usuarioAtual = null;

    function mostrarTela(idTela) {
      document.getElementById('telaLogin').style.display = 'none';
      document.getElementById('telaCadastro').style.display = 'none';
      document.getElementById('aplicativo').style.display = 'none';
      
      document.getElementById(idTela).style.display = 'flex';
      if (idTela === 'aplicativo') document.getElementById('aplicativo').style.display = 'block';
    }

    function cadastrarUsuario() {
      const nome = document.getElementById('cadNome').value.trim();
      const usuario = document.getElementById('cadUsuario').value.trim().toLowerCase();
      const email = document.getElementById('cadEmail').value.trim().toLowerCase();
      const senha = document.getElementById('cadSenha').value;
      const erro = document.getElementById('erroCadastro');

      if (!nome || !usuario || !email || !senha) {
        erro.innerText = 'Por favor, preencha todos os campos!';
        erro.style.display = 'block';
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem('san_usuarios'));
      
      const jaExiste = usuarios.some(u => u.usuario === usuario || u.email === email);
      if (jaExiste) {
        erro.innerText = 'Utilizador ou e-mail já cadastrado!';
        erro.style.display = 'block';
        return;
      }

      const novoUsuario = { nome, usuario, email, senha };
      usuarios.push(novoUsuario);
      localStorage.setItem('san_usuarios', JSON.stringify(usuarios));

      alert('Conta criada com sucesso! Faça login para continuar.');
      document.getElementById('cadNome').value = '';
      document.getElementById('cadUsuario').value = '';
      document.getElementById('cadEmail').value = '';
      document.getElementById('cadSenha').value = '';
      erro.style.display = 'none';
      mostrarTela('telaLogin');
    }

    function fazerLogin() {
      const login = document.getElementById('loginUsuario').value.trim().toLowerCase();
      const senha = document.getElementById('loginSenha').value;
      const erro = document.getElementById('erroLogin');

      const usuarios = JSON.parse(localStorage.getItem('san_usuarios'));
      const usuarioEncontrado = usuarios.find(u => (u.usuario === login || u.email === login) && u.senha === senha);

      if (usuarioEncontrado) {
        usuarioAtual = usuarioEncontrado;
        erro.style.display = 'none';
        carregarPosts();
        mostrarTela('aplicativo');
      } else {
        erro.style.display = 'block';
      }
    }

    function sair() {
      usuarioAtual = null;
      document.getElementById('loginUsuario').value = '';
      document.getElementById('loginSenha').value = '';
      mostrarTela('telaLogin');
    }

    function publicar() {
      const texto = document.getElementById('textoPost').value.trim();
      if (!texto) return;

      const posts = JSON.parse(localStorage.getItem('san_posts'));
      posts.unshift({
        autor: usuarioAtual ? usuarioAtual.nome : 'Anónimo',
        conteudo: texto
      });

      localStorage.setItem('san_posts', JSON.stringify(posts));
      document.getElementById('textoPost').value = '';
      carregarPosts();
    }

    function carregarPosts() {
      const posts = JSON.parse(localStorage.getItem('san_posts'));
      const container = document.getElementById('listaPosts');
      container.innerHTML = '';

      posts.forEach(post => {
        const div = document.createElement('div');
        div.className = 'post';
        div.innerHTML = `
          <div class="autor-post">${post.autor}</div>
          <div class="conteudo-post">${post.conteudo}</div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
