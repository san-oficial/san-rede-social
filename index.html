<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAN — Rede Social</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- SDKs do Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --bg-primary: #f0f2f5;
    --card-bg: #ffffff;
    --primary-color: #2b56f5;
    --gradient-btn: linear-gradient(135deg, #2b56f5, #4f46e5);
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --border-color: #e2e8f0;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

body {
    min-height: 100vh;
    background: var(--bg-primary);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 15px 10px;
    transition: background 0.4s ease;
    position: relative;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 430px;
    background: var(--card-bg);
    border-radius: 28px;
    padding: 20px 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    position: relative;
    min-height: 620px;
    z-index: 10;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 5px;
}

.logo-text {
    font-size: 26px;
    font-weight: 800;
    color: var(--primary-color);
}

.auth-container { display: block; padding: 20px 10px; text-align: center; }
.auth-title { font-size: 32px; font-weight: 800; color: var(--primary-color); margin-bottom: 5px; }
.auth-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; }
.form-box { display: none; }
.form-box.active { display: block; }

input, textarea {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    background: #f8fafc;
    font-size: 14px;
    outline: none;
    color: var(--text-primary);
}

.btn-purple {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: var(--gradient-btn);
    color: white;
    box-shadow: 0 4px 14px rgba(43, 86, 245, 0.25);
}

.app-screen { display: none; padding-bottom: 60px; }
.app-screen.active { display: block; }

.create-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
}

.create-card textarea {
    height: 75px;
    resize: none;
}

.file-upload-outline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border: 1.5px dashed var(--border-color);
    border-radius: 14px;
    color: var(--primary-color);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    background: #f8fafc;
}

.post-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
}

.post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.post-body { font-size: 14px; margin-bottom: 12px; word-break: break-word; }
.post-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 14px; margin-bottom: 12px; }

.bottom-nav {
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    background: var(--card-bg);
    border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around;
    padding: 12px 0;
    border-bottom-left-radius: 28px;
    border-bottom-right-radius: 28px;
}
.nav-tab { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }
.nav-tab.active { color: var(--primary-color); }
.message { display:none; margin-top:10px; padding:8px; border-radius:8px; font-size:12px; text-align: center; }
.message.error { display:block; background:#ffe8e8; color:#c62828; }
</style>
</head>
<body>

<div class="container">
  
  <div id="authSection" class="auth-container">
      <div class="auth-title">SAN</div>
      <div class="auth-sub">Sua rede social</div>

      <div id="loginForm" class="form-box active">
          <h3>Entrar</h3>
          <input type="email" id="loginEmail" placeholder="E-mail">
          <input type="password" id="loginPassword" placeholder="Palavra-passe">
          <button type="button" class="btn-purple" onclick="fazerLogin()">Entrar</button>
          <button type="button" style="background:none;border:none;color:var(--primary-color);margin-top:15px;cursor:pointer;" onclick="mostrarCadastro()">Criar nova conta</button>
          <div id="loginMsg" class="message"></div>
      </div>

      <div id="registerForm" class="form-box">
          <h3>Criar conta</h3>
          <input type="text" id="registerName" placeholder="Nome completo">
          <input type="email" id="registerEmail" placeholder="E-mail">
          <input type="password" id="registerPassword" placeholder="Palavra-passe">
          <button type="button" class="btn-purple" onclick="fazerCadastro()">Criar conta</button>
          <button type="button" style="background:none;border:none;color:var(--primary-color);margin-top:15px;cursor:pointer;" onclick="mostrarLogin()">← Voltar</button>
          <div id="regMsg" class="message"></div>
      </div>
  </div>

  <div id="appScreen" class="app-screen">
      <div class="app-header">
          <div class="logo-text">SAN</div>
          <button class="nav-tab" onclick="fazerLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>

      <div class="create-card">
          <textarea id="postText" placeholder="O que está a acontecer?"></textarea>
          <label class="file-upload-outline">
              <i class="fa-regular fa-image"></i> <span id="fileLabel">Anexar foto da galeria</span>
              <input type="file" id="postImageFile" accept="image/*" style="display:none;" onchange="processarImagemPost(event)">
          </label>
          <button id="btnPublish" class="btn-purple" onclick="criarPostFirebase()">Publicar</button>
      </div>
      
      <div id="postsFeed"></div>

      <div class="bottom-nav">
          <button class="nav-tab active"><i class="fa-solid fa-house"></i></button>
          <button class="nav-tab"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="nav-tab"><i class="fa-solid fa-bell"></i></button>
          <button class="nav-tab"><i class="fa-solid fa-user"></i></button>
      </div>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC5oZBuiU21MeUcIGXYHYiRlvog99bli-c",
    authDomain: "san-e4e0b.firebaseapp.com",
    projectId: "san-e4e0b",
    storageBucket: "san-e4e0b.firebasestorage.app",
    messagingSenderId: "948679953856",
    appId: "1:948679953856:web:67f015a553b704739ccc25"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let usuarioAtual = null;
  let imagemBase64 = "";

  auth.onAuthStateChanged(user => {
      if (user) {
          usuarioAtual = user;
          document.getElementById("authSection").style.display = "none";
          document.getElementById("appScreen").classList.add("active");
          ouvirPosts();
      } else {
          usuarioAtual = null;
          document.getElementById("appScreen").classList.remove("active");
          document.getElementById("authSection").style.display = "block";
      }
  });

  function mostrarCadastro(){
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("registerForm").classList.add("active");
  }

  function mostrarLogin(){
      document.getElementById("registerForm").classList.remove("active");
      document.getElementById("loginForm").classList.add("active");
  }

  function fazerLogin(){
      const e = document.getElementById("loginEmail").value.trim();
      const p = document.getElementById("loginPassword").value;
      auth.signInWithEmailAndPassword(e, p).catch(err => {
          document.getElementById("loginMsg").innerText = err.message;
          document.getElementById("loginMsg").className = "message error";
      });
  }

  function fazerCadastro(){
      const n = document.getElementById("registerName").value.trim();
      const e = document.getElementById("registerEmail").value.trim();
      const p = document.getElementById("registerPassword").value;
      
      auth.createUserWithEmailAndPassword(e, p).then(cred => {
          return db.collection("users").doc(cred.user.uid).set({
              nome: n,
              criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
      }).catch(err => {
          document.getElementById("regMsg").innerText = err.message;
          document.getElementById("regMsg").className = "message error";
      });
  }

  function fazerLogout(){ auth.signOut(); }

  function processarImagemPost(event) {
      const file = event.target.files[0];
      if (file) {
          document.getElementById("fileLabel").innerText = file.name.substring(0, 15) + "...";
          const reader = new FileReader();
          reader.onload = function(e) {
              const img = new Image();
              img.onload = function() {
                  const canvas = document.createElement('canvas');
                  let w = img.width, h = img.height;
                  if (w > 600) { h = (600/w)*h; w = 600; }
                  canvas.width = w; canvas.height = h;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, w, h);
                  imagemBase64 = canvas.toDataURL('image/jpeg', 0.6);
              };
              img.src = e.target.result;
          };
          reader.readAsDataURL(file);
      }
  }

  function criarPostFirebase() {
      const texto = document.getElementById("postText").value.trim();
      if (!texto && !imagemBase64) {
          alert("Escreva algo ou insira uma imagem!");
          return;
      }

      const btn = document.getElementById("btnPublish");
      btn.innerText = "A publicar...";
      btn.disabled = true;

      const nomeAutor = usuarioAtual.email ? usuarioAtual.email.split('@')[0] : "Usuário SAN";

      db.collection("posts").add({
          uid: usuarioAtual.uid,
          autor: nomeAutor,
          texto: texto,
          imagem: imagemBase64,
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
          document.getElementById("postText").value = "";
          document.getElementById("postImageFile").value = "";
          document.getElementById("fileLabel").innerText = "Anexar foto da galeria";
          imagemBase64 = "";
          alert("Publicado com sucesso!");
      }).catch(error => {
          alert("Erro ao publicar: " + error.message);
      }).finally(() => {
          btn.innerText = "Publicar";
          btn.disabled = false;
      });
  }

  function ouvirPosts() {
      db.collection("posts").orderBy("criadoEm", "desc").onSnapshot(snapshot => {
          const feed = document.getElementById("postsFeed");
          feed.innerHTML = "";
          snapshot.forEach(doc => {
              const p = doc.data();
              let imgTag = p.imagem ? `<img src="${p.imagem}" class="post-img">` : "";
              feed.innerHTML += `
                  <div class="post-card">
                      <div class="post-header">
                          <div class="avatar-circle">${(p.autor || 'U').charAt(0).toUpperCase()}</div>
                          <div><b>${p.autor || 'Usuário'}</b></div>
                      </div>
                      <div class="post-body">${p.texto || ''}</div>
                      ${imgTag}
                  </div>
              `;
          });
      });
  }
</script>
</body>
</html>
