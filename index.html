<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAN — Rede Social</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- SDKs do Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --bg-primary: #f0f2f5;
    --card-bg: #ffffff;
    --primary-color: #2b56f5;
    --gradient-btn: linear-gradient(135deg, #2b56f5, #4f46e5);
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --border-color: #e2e8f0;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

body {
    min-height: 100vh;
    background: var(--bg-primary);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 15px 10px;
    transition: background 0.4s ease;
    position: relative;
    overflow-x: hidden;
}

/* Canvas para efeitos festivos (Neve, Confete, etc) */
#fxCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
}

.container {
    width: 100%;
    max-width: 430px;
    background: var(--card-bg);
    border-radius: 28px;
    padding: 20px 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    position: relative;
    min-height: 620px;
    z-index: 10;
    transition: background 0.4s ease;
}

/* Header principal */
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 5px;
}

.logo-text {
    font-size: 26px;
    font-weight: 800;
    color: var(--primary-color);
}

.header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.icon-circle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(43, 86, 245, 0.1);
    color: var(--primary-color);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.2s ease;
}
.icon-circle-btn:active { transform: scale(0.92); }

/* Selector de Temas / Datas Comemorativas */
.theme-selector-wrapper {
    margin-bottom: 15px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.03);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
}

.theme-select {
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-primary);
    font-weight: 600;
    font-size: 12px;
    outline: none;
    cursor: pointer;
}

/* Banner do Tema Ativo */
.theme-banner {
    display: none;
    padding: 10px 14px;
    border-radius: 14px;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

/* Seção de Stories */
.stories-wrapper {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 5px 0 15px 0;
    margin-bottom: 10px;
    scrollbar-width: none;
}
.stories-wrapper::-webkit-scrollbar { display: none; }

.story-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    flex-shrink: 0;
}

.story-ring {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    padding: 2.5px;
    background: linear-gradient(135deg, var(--primary-color), #ec4899, #f59e0b);
    display: flex;
    align-items: center;
    justify-content: center;
}

.story-ring.add-story {
    background: #e2e8f0;
}

.story-thumb {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid #fff;
    object-fit: cover;
    background: var(--primary-color);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
}

.story-name {
    font-size: 11px;
    color: var(--text-secondary);
    max-width: 65px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
}

/* Modal de Visualizar Story */
.story-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
}
.story-modal.active { display: flex; }
.story-modal img { max-width: 90%; max-height: 75vh; border-radius: 16px; object-fit: contain; }
.story-modal-close { position: absolute; top: 20px; right: 20px; font-size: 28px; cursor: pointer; color: white; }

/* Formulários de Autenticação */
.auth-container { display: block; padding: 20px 10px; text-align: center; }
.auth-title { font-size: 32px; font-weight: 800; color: var(--primary-color); margin-bottom: 5px; }
.auth-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; }
.form-box { display: none; }
.form-box.active { display: block; }
.form-box h3 { margin-bottom: 15px; color: var(--text-primary); }

input, textarea {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    background: #f8fafc;
    font-size: 14px;
    outline: none;
    color: var(--text-primary);
    transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: var(--primary-color); background: #fff; }

.btn-purple {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: var(--gradient-btn);
    color: white;
    box-shadow: 0 4px 14px rgba(43, 86, 245, 0.25);
    transition: all 0.2s ease;
}
.btn-purple:active { transform: scale(0.98); opacity: 0.9; }

.btn-secondary-link {
    background: none;
    border: none;
    color: var(--primary-color);
    font-size: 14px;
    font-weight: 600;
    margin-top: 15px;
    cursor: pointer;
}

/* Ecrã da Aplicação */
.app-screen { display: none; padding-bottom: 60px; }
.app-screen.active { display: block; }

/* Cartão de Criar Publicação */
.create-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.03);
}

.create-card textarea {
    height: 75px;
    resize: none;
    border: 1px solid var(--border-color);
    background: #f8fafc;
    margin-bottom: 12px;
}

.file-upload-outline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border: 1.5px dashed var(--border-color);
    border-radius: 14px;
    color: var(--primary-color);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    background: #f8fafc;
    transition: all 0.2s;
}
.file-upload-outline:hover { background: #f0f4fe; border-color: var(--primary-color); }

/* Feed e Cartão de Post */
.post-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.03);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.avatar-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--primary-color);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
}

.post-author-info h4 { font-size: 15px; color: var(--text-primary); font-weight: 700; }
.post-author-info span { font-size: 12px; color: var(--text-secondary); }

.post-body { font-size: 14px; color: var(--text-primary); margin-bottom: 12px; line-height: 1.4; word-break: break-word; }
.post-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 14px; margin-bottom: 12px; }

.like-btn {
    background: #f8fafc;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    transition: all 0.2s;
}

.like-btn.liked { color: #e11d48; background: #ffe4e6; }

.comments-area { margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 10px; }
.comment-bubble {
    background: #f8fafc;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-primary);
    margin-bottom: 6px;
}

.comment-input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.comment-input-row input {
    margin-bottom: 0;
    padding: 10px 14px;
    border-radius: 14px;
}

.comment-input-row button {
    width: auto;
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 13px;
}

/* Barra de Navegação Inferior */
.bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: var(--card-bg);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-around;
    padding: 12px 0;
    border-bottom-left-radius: 28px;
    border-bottom-right-radius: 28px;
}

.nav-tab {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    transition: color 0.2s;
}

.nav-tab.active { color: var(--primary-color); }

.tab-content { display: none; }
.tab-content.active { display: block; }
.message { display:none; margin-top:10px; padding:8px; border-radius:8px; font-size:12px; text-align: center; }
.message.error { display:block; background:#ffe8e8; color:#c62828; }

/* === TEMAS INTERATIVOS === */
/* Natal */
body.theme-natal { --bg-primary: #0f1e16; --card-bg: #162a1f; --primary-color: #e53e3e; --gradient-btn: linear-gradient(135deg, #e53e3e, #38a169); --text-primary: #f7fafc; --text-secondary: #cbd5e0; --border-color: #2f855a; }
/* Carnaval */
body.theme-carnaval { --bg-primary: #2d124d; --card-bg: #3c1a66; --primary-color: #f6e05e; --gradient-btn: linear-gradient(135deg, #d69e2e, #b794f4); --text-primary: #ffffff; --text-secondary: #e9d8fd; --border-color: #6b46c1; }
/* Independência do Brasil */
body.theme-brasil { --bg-primary: #064e3b; --card-bg: #046c4e; --primary-color: #facc15; --gradient-btn: linear-gradient(135deg, #16a34a, #eab308); --text-primary: #ffffff; --text-secondary: #fef08a; --border-color: #15803d; }
/* Halloween */
body.theme-halloween { --bg-primary: #18181b; --card-bg: #27272a; --primary-color: #f97316; --gradient-btn: linear-gradient(135deg, #f97316, #a855f7); --text-primary: #f4f4f5; --text-secondary: #a1a1aa; --border-color: #3f3f46; }
/* Páscoa */
body.theme-pascoa { --bg-primary: #fdf2f8; --card-bg: #ffffff; --primary-color: #ec4899; --gradient-btn: linear-gradient(135deg, #f472b6, #38bdf8); --text-primary: #1e293b; --text-secondary: #64748b; --border-color: #fbcfe8; }
/* Ano Novo */
body.theme-anonovo { --bg-primary: #0f172a; --card-bg: #1e293b; --primary-color: #e2e8f0; --gradient-btn: linear-gradient(135deg, #e2e8f0, #94a3b8); --text-primary: #ffffff; --text-secondary: #cbd5e1; --border-color: #334155; }
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div class="container">
  
  <!-- Secção de Autenticação -->
  <div id="authSection" class="auth-container">
      <div class="auth-title">SAN</div>
      <div class="auth-sub">Sua rede social</div>

      <div id="loginForm" class="form-box active">
          <h3>Entrar</h3>
          <input type="email" id="loginEmail" placeholder="E-mail">
          <input type="password" id="loginPassword" placeholder="Palavra-passe">
          <button type="button" class="btn-purple" onclick="fazerLogin()">Entrar</button>
          <button type="button" class="btn-secondary-link" onclick="mostrarCadastro()">Criar nova conta</button>
          <div id="loginMsg" class="message"></div>
      </div>

      <div id="registerForm" class="form-box">
          <h3>Criar nova conta</h3>
          <input type="text" id="registerName" placeholder="Nome completo">
          <input type="email" id="registerEmail" placeholder="E-mail">
          <input type="password" id="registerPassword" placeholder="Palavra-passe">
          <button type="button" class="btn-purple" onclick="fazerCadastro()">Criar conta</button>
          <button type="button" class="btn-secondary-link" onclick="mostrarLogin()">← Voltar para entrar</button>
          <div id="regMsg" class="message"></div>
      </div>
  </div>

  <!-- Secção da Aplicação -->
  <div id="appScreen" class="app-screen">
      
      <div class="app-header">
          <div class="logo-text">SAN</div>
          <div class="header-actions">
              <button class="icon-circle-btn" onclick="fazerLogout()" title="Sair">
                  <i class="fa-solid fa-right-from-bracket"></i>
              </button>
          </div>
      </div>

      <!-- Seletor de Modo Interativo / Estações e Datas -->
      <div class="theme-selector-wrapper">
          <span><i class="fa-solid fa-wand-magic-sparkles"></i> Tema / Época:</span>
          <select id="themeSelect" class="theme-select" onchange="alterarTema(this.value)">
              <option value="padrao">Padrão</option>
              <option value="natal">🎄 Natal</option>
              <option value="carnaval">🎭 Carnaval</option>
              <option value="brasil">🇧🇷 Independência</option>
              <option value="halloween">🎃 Halloween</option>
              <option value="pascoa">🐰 Páscoa</option>
              <option value="anonovo">🎆 Ano Novo</option>
          </select>
      </div>

      <div id="themeBanner" class="theme-banner"></div>

      <!-- Carrossel de Stories -->
      <div class="stories-wrapper" id="storiesFeed">
          <div class="story-item" onclick="document.getElementById('storyImageFile').click()">
              <div class="story-ring add-story">
                  <div class="story-thumb" style="background:#e2e8f0; color:#2b56f5;">
                      <i class="fa-solid fa-plus"></i>
                  </div>
              </div>
              <span class="story-name">Seu story</span>
              <input type="file" id="storyImageFile" accept="image/*" style="display:none;" onchange="publicarStory(event)">
          </div>
      </div>

      <!-- Aba Feed (Home) -->
      <div id="tabHome" class="tab-content active">
          <div class="create-card">
              <textarea id="postText" placeholder="O que está a acontecer?"></textarea>
              <label class="file-upload-outline">
                  <i class="fa-regular fa-image"></i> <span id="fileLabel">Anexar foto da galeria</span>
                  <input type="file" id="postImageFile" accept="image/*" style="display:none;" onchange="processarImagemPost(event)">
              </label>
              <button id="btnPublish" class="btn-purple" onclick="criarPostFirebase()">Publicar</button>
          </div>
          
          <div id="postsFeed"></div>
      </div>

      <!-- Aba Pesquisar -->
      <div id="tabSearch" class="tab-content">
          <input type="text" placeholder="Pesquisar publicações...">
      </div>

      <!-- Aba Notificações -->
      <div id="tabNotifications" class="tab-content">
          <h3 style="margin-bottom:12px; font-size:16px;">Notificações</h3>
          <div class="comment-bubble"><b>SAN:</b> Bem-vindo à rede social SAN!</div>
      </div>

      <!-- Aba Perfil -->
      <div id="tabProfile" class="tab-content">
          <div class="post-card" style="text-align:center;">
              <div id="profileAvatar" class="avatar-circle" style="width:70px; height:70px; font-size:26px; margin: 0 auto 12px;">U</div>
              <h3 id="profileName">A carregar...</h3>
              <p id="profileBio" style="font-size:13px; color:var(--text-secondary); margin:6px 0 16px;">Sem biografia definida.</p>
              <input type="text" id="editBioInput" placeholder="Editar biografia...">
              <button class="btn-purple" onclick="salvarBio()">Guardar Perfil</button>
          </div>
      </div>

      <!-- Navegação Inferior -->
      <div class="bottom-nav">
          <button class="nav-tab active" onclick="mudarAba('Home', this)"><i class="fa-solid fa-house"></i></button>
          <button class="nav-tab" onclick="mudarAba('Search', this)"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="nav-tab" onclick="mudarAba('Notifications', this)"><i class="fa-solid fa-bell"></i></button>
          <button class="nav-tab" onclick="mudarAba('Profile', this)"><i class="fa-solid fa-user"></i></button>
      </div>

  </div>

</div>

<!-- Modal para ver Story -->
<div id="storyModal" class="story-modal" onclick="fecharStoryModal()">
    <span class="story-modal-close">&times;</span>
    <img id="storyModalImg" src="" alt="Story">
    <p id="storyModalUser" style="margin-top:10px; font-weight:bold;"></p>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC5oZBuiU21MeUcIGXYHYiRlvog99bli-c",
    authDomain: "san-e4e0b.firebaseapp.com",
    projectId: "san-e4e0b",
    storageBucket: "san-e4e0b.firebasestorage.app",
    messagingSenderId: "948679953856",
    appId: "1:948679953856:web:67f015a553b704739ccc25"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let usuarioAtual = null;
  let imagemBase64 = "";

  auth.onAuthStateChanged(user => {
      if (user) {
          usuarioAtual = user;
          document.getElementById("authSection").style.display = "none";
          document.getElementById("appScreen").classList.add("active");
          carregarPerfil();
          ouvirPostsTempoReal();
          ouvirStoriesTempoReal();
      } else {
          usuarioAtual = null;
          document.getElementById("appScreen").classList.remove("active");
          document.getElementById("authSection").style.display = "block";
      }
  });

  function mostrarCadastro(){
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("registerForm").classList.add("active");
  }

  function mostrarLogin(){
      document.getElementById("registerForm").classList.remove("active");
      document.getElementById("loginForm").classList.add("active");
  }

  function mudarAba(nomeAba, elementoBtn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab' + nomeAba).classList.add('active');
      elementoBtn.classList.add('active');
  }

  async function fazerLogin(){
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPassword").value;
      try {
          await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
          document.getElementById("loginMsg").innerText = err.message;
          document.getElementById("loginMsg").className = "message error";
      }
  }

  async function fazerCadastro(){
      const nome = document.getElementById("registerName").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const pass = document.getElementById("registerPassword").value;
      try {
          const userCred = await auth.createUserWithEmailAndPassword(email, pass);
          await db.collection("users").doc(userCred.user.uid).set({
              nome: nome,
